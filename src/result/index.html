<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Video2Team · 结果</title>
    <style>
      /* ================= 设计基线 =================
         8px 间距栅格 / 4 级字号（22 标题 · 15 分区 · 13 正文 · 11 辅助）/
         低饱和中性色 + 单一强调色（#23ade5），状态色仅用于语义（绿=保留、橙=替换、红=无解） */
      :root {
        color-scheme: light;
        --ink: #1f2328;
        --ink-2: #57606a;
        --ink-3: #8b949e;
        --line: #e6e8eb;
        --bg: #f6f8fa;
        --card: #ffffff;
        --accent: #23ade5;
        --ok: #1a7f37;
        --warn: #b8860b;
        --bad: #c0392b;
        --maa: #0969da;
        --bili: #e0559b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        font-size: 13px; line-height: 1.6;
      }
      /* ---- 顶部工具条（吸顶） ---- */
      header {
        position: sticky; top: 0; z-index: 10; background: var(--card);
        border-bottom: 1px solid var(--line); padding: 12px 20px;
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      }
      header .brand { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
      header .stage { font-size: 13px; color: var(--ink-2); }
      header .grow { flex: auto; }
      .chip {
        display: inline-flex; align-items: center; gap: 4px;
        background: #f1f3f5; border: 1px solid var(--line); border-radius: 999px;
        padding: 2px 10px; font-size: 12px; color: var(--ink-2);
      }
      .btn {
        border: 1px solid var(--line); background: var(--card); color: var(--ink);
        border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
      }
      .btn:hover { background: #f6f8fa; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { filter: brightness(.95); }

      /* ---- 布局：总览铺满 + 两栏（主=本关阵容 / 侧=前置关候选池） ---- */
      main { max-width: 1240px; margin: 0 auto; padding: 16px 20px 40px; }
      .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
      @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 16px;
      }
      .card > .card-title {
        font-size: 15px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 6px;
      }
      .card > .card-title .sub { font-size: 12px; font-weight: 400; color: var(--ink-3); }
      .muted { color: var(--ink-3); }
      #status { color: var(--ink-3); font-size: 12px; margin: 0 0 12px; }
      #status:empty { display: none; }

      /* ---- 渲染层（renderResult 输出）样式 ---- */
      .video-title { font-size: 12px; color: var(--ink-2); margin: 0 0 2px; }
      .stage { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
      .slot {
        font-size: 14px; line-height: 1.65; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
        background: #fbfcfd; border: 1px solid var(--line); border-left-width: 3px;
      }
      .keep { border-left-color: var(--ok); }
      .sub { border-left-color: var(--warn); }
      .unresolved { border-left-color: var(--bad); }
      .slot .note { color: var(--bad); font-size: 12px; }
      .slot a, a.link { color: var(--accent); text-decoration: none; font-size: 12px; }
      .slot .alts { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
      .sub-line { display: block; line-height: 1.7; }
      .own { color: var(--ok); font-weight: 700; }
      .miss { color: var(--bad); font-weight: 700; }
      .occupied { color: #999; text-decoration: line-through; }
      .pickbox { cursor: pointer; margin: 2px 0 0; }
      .schemerow:hover { background: #f3f9fd; border-radius: 6px; }
      .quote { color: #999; }
      .dim { color: var(--ink-3); font-size: 12px; }
      .err { color: var(--bad); }
      .hint { font-size: 12px; color: var(--ink-3); line-height: 1.7; }
      a { color: var(--accent); text-decoration: none; }
      /* ---- 第九轮 q3：大窗口比页内面板放大一档（方案行/表头/下拉 13px、辅助文字 12px）----
         渲染层带行内 12px/11px，需页面级 !important 覆盖 */
      .schemerow { font-size: 13px !important; }
      .stagepool > div:first-child { font-size: 13px !important; }
      .dim { font-size: 12px !important; }
      /* 「＋ 补一个关」下拉：与卡片一致（hover/focus 可见、200ms 过渡、tabular 数字） */
      .stage-select {
        font: inherit; font-size: 13px; line-height: 1.4; padding: 5px 10px; min-height: 32px;
        border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
        cursor: pointer; transition: border-color .2s, box-shadow .2s;
      }
      .stage-select:hover { border-color: var(--accent); }
      .stage-select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(35,173,229,.25); }
      /* 折叠摘要（渲染层带行内 11px，需 !important 才提得上来） */
      details summary { color: var(--ink-3); font-size: 12px !important; cursor: pointer; }
      #locks:empty::after { content: "（空，勾选候选方案即可占用）"; color: var(--ink-3); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">🎮 Video2Team</span>
      <span class="stage" id="stageName"></span>
      <span class="grow"></span>
      <span id="chips"></span>
      <button class="btn" id="refreshBtn" title="重新读取结果">⟳ 刷新</button>
      <button class="btn" id="clearLocks" title="清空占用清单与勾选">清除占用</button>
      <button class="btn" id="closeBtn" title="关闭（Esc）">✕ 关闭</button>
    </header>
    <main>
      <div id="status"></div>
      <div class="cols">
        <div id="col-main"></div>
        <div id="col-side"></div>
      </div>
    </main>
    <script type="module" src="./result.js"></script>
  </body>
</html>
