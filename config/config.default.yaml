# Video2Team 默认配置
# 首次运行时自动复制为 config.yaml（gitignored），修改 config.yaml 即时生效。

deepseek:
  analysis_mode: api        # api | web
  api_key: ""               # DeepSeek API Key
  model: deepseek-v4-flash
  timeout_seconds: 120

video:
  frame_interval: 5         # 抽帧间隔(秒)
  max_frames: 20

ocr:
  min_chars: 6              # 最少有效字符数（干员名比菜谱短，阈值低于 Video2Shop）

comments:
  max_comments: 200         # 最多拉取的评论数
  min_likes: 5              # 低于该赞数的评论降权
  danmaku_enabled: true     # v1 接入弹幕

box:
  source: excel             # excel | skland(v2)
  excel_path: ""            # 一图流导出的练度表路径

output:
  show_evidence: true       # 输出中附带评论区溯源链接
